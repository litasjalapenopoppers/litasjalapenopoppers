# Keeps the free Supabase database from being paused for inactivity.
# Every day GitHub makes a small request to the database. It first tries the
# keep_alive() function; if that function was never created, it falls back to
# a plain read of the staff table, which still counts as activity.
name: Keep database awake

on:
  schedule:
    - cron: "17 14 * * *"   # every day at 14:17 UTC
  workflow_dispatch:        # lets you press "Run workflow" by hand to test it

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ask the database if it is awake
        run: |
          URL=$(sed -n 's/^const SUPABASE_URL *= *["'"'"']\([^"'"'"']*\)["'"'"'].*/\1/p' db.js | head -1)
          KEY=$(sed -n 's/^const SUPABASE_ANON_KEY *= *["'"'"']\([^"'"'"']*\)["'"'"'].*/\1/p' db.js | head -1)
          echo "Project address found: $URL"
          case "$URL" in
            https://*.supabase.co) ;;
            *) echo "db.js does not have a real Supabase address."; exit 1 ;;
          esac
          [ -n "$KEY" ] || { echo "db.js does not have a key."; exit 1; }

          CODE=$(curl -sS -m 40 -o body.txt -w "%{http_code}" -X POST "$URL/rest/v1/rpc/keep_alive" \
            -H "apikey: $KEY" -H "Authorization: Bearer $KEY" \
            -H "Content-Type: application/json" -d '{}' || echo 000)
          echo "keep_alive() -> HTTP $CODE: $(head -c 200 body.txt)"
          if [ "$CODE" = "200" ]; then exit 0; fi

          echo "Falling back to a plain read of the staff table..."
          CODE=$(curl -sS -m 40 -o body.txt -w "%{http_code}" \
            "$URL/rest/v1/staff?select=id&limit=1" \
            -H "apikey: $KEY" -H "Authorization: Bearer $KEY" || echo 000)
          echo "staff read -> HTTP $CODE: $(head -c 200 body.txt)"
          if [ "$CODE" = "200" ]; then exit 0; fi

          echo "The database did not answer. It may be paused: open Supabase and press Restore project."
          exit 1
